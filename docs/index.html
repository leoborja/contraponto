<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>Contraponto — os dois lados de um debate</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f2430; --txt:#e7e9ee; --muted:#9aa3b2;
    --esq:#4f8cff; --dir:#ff6b6b; --consenso:#3ddc97; --linha:#2a2f3a; --accent:#e7e9ee;
    --player-h: 118px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:0 14px calc(var(--player-h) + 34px);max-width:760px;margin:0 auto}
  header{text-align:center;padding:28px 0 18px;border-bottom:1px solid var(--linha);margin-bottom:18px}
  h1{font-size:28px;letter-spacing:-.5px}
  h1 .a{color:var(--esq)} h1 .b{color:var(--dir)}
  header p{color:var(--muted);margin-top:5px;font-size:14px}

  /* ---- lista de episódios ---- */
  .ep{background:var(--card);border:1px solid var(--linha);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .ep.playing{border-color:var(--esq)}
  .ep-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
  .ep-play{flex:0 0 52px;height:52px;border-radius:50%;border:none;background:var(--card2);color:var(--txt);
           font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
  .ep.playing .ep-play{background:var(--esq);color:#fff}
  .ep-info{flex:1;min-width:0}
  .ep-info h2{font-size:16.5px;line-height:1.3}
  .ep-meta{color:var(--muted);font-size:12.5px;margin-top:3px}
  .ep-resume{color:var(--consenso);font-size:12px;margin-top:2px}
  .ep-toggle{flex:0 0 auto;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px}
  .ep-body{display:none;padding:0 16px 16px;border-top:1px solid var(--linha)}
  .ep.open .ep-body{display:block}
  .lados{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
  @media(max-width:520px){.lados{grid-template-columns:1fr}}
  .lado{background:var(--card2);border-radius:10px;padding:12px;border-left:3px solid}
  .lado.esq{border-color:var(--esq)} .lado.dir{border-color:var(--dir)}
  .lado .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:block}
  .lado.esq .tag{color:var(--esq)} .lado.dir .tag{color:var(--dir)}
  .lado p{font-size:13.5px;color:#cfd4de}
  details{background:var(--card2);border-radius:10px;margin-top:8px;overflow:hidden}
  summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;list-style:none;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--muted)}
  details[open] summary::before{content:"▾ "}
  details .body{padding:0 14px 12px}
  details.consenso summary{color:var(--consenso)}
  details ul{margin-left:18px;font-size:13.5px;color:#cfd4de}
  details li{margin:4px 0}
  .fonte{display:block;font-size:13px;color:var(--esq);text-decoration:none;margin:3px 0;word-break:break-word}
  .empty{text-align:center;color:var(--muted);padding:40px 0}

  /* ---- player fixo ---- */
  #player{position:fixed;left:0;right:0;bottom:0;background:rgba(20,23,30,.97);backdrop-filter:blur(10px);
          border-top:1px solid var(--linha);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:50;
          display:none}
  #player.on{display:block}
  #player .inner{max-width:760px;margin:0 auto}
  #p-title{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
  #p-seek{width:100%;height:26px;appearance:none;background:transparent;cursor:pointer;display:block}
  #p-seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--esq) var(--fill,0%),#333a48 var(--fill,0%))}
  #p-seek::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6px}
  .p-controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
  .p-time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:86px}
  .p-time.right{text-align:right}
  .p-btn{border:none;background:var(--card2);color:var(--txt);border-radius:50%;cursor:pointer;
         display:flex;align-items:center;justify-content:center;flex-direction:column;transition:transform .1s}
  .p-btn:active{transform:scale(.92)}
  #p-back,#p-fwd{width:58px;height:58px;font-size:13px;font-weight:700}
  #p-back span.ic,#p-fwd span.ic{font-size:19px;line-height:1}
  #p-play{width:74px;height:74px;background:var(--esq);color:#fff;font-size:30px}
  #p-speed{width:58px;height:58px;font-size:14.5px;font-weight:700;border-radius:50%}
  .spacer{flex:1;max-width:8px}
</style>
</head>
<body>
<header>
  <h1><span class="a">Contra</span><span class="b">ponto</span></h1>
  <p>Os dois lados de um debate. Esquerda, direita, e onde eles concordam.</p>
</header>
<main id="app"><div class="empty">Carregando episódios…</div></main>

<div id="player">
  <div class="inner">
    <div id="p-title"></div>
    <input id="p-seek" type="range" min="0" max="100" step="0.1" value="0">
    <div class="p-controls">
      <div class="p-time" id="p-cur">0:00</div>
      <button class="p-btn" id="p-back" title="voltar 15s"><span class="ic">↺</span>15</button>
      <div class="spacer"></div>
      <button class="p-btn" id="p-play" title="play/pause">▶</button>
      <div class="spacer"></div>
      <button class="p-btn" id="p-fwd" title="avançar 30s"><span class="ic">↻</span>30</button>
      <button class="p-btn" id="p-speed" title="velocidade">1×</button>
      <div class="p-time right" id="p-dur">0:00</div>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
const SPEEDS = [1, 1.25, 1.5, 2];
let episodes = [], current = null, speedIx = +(localStorage.getItem('cp:speed') || 0);

const fmt = s => { s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60), ss=String(s%60).padStart(2,'0');
  return m>=60 ? `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}:${ss}` : `${m}:${ss}`; };
const fmtData = d => d ? d.split('-').reverse().join('/') : '';
const esc = t => (t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const posKey = slug => 'cp:pos:' + slug;

function li(a){ return (a||[]).map(x=>`<li>${esc(x)}</li>`).join(''); }
function fontes(a){ return (a||[]).map(f=>`<a class="fonte" href="${esc(f.url)}" target="_blank" rel="noopener">↗ ${esc(f.titulo||f.url)}</a>`).join(''); }

function card(e){
  const saved = +(localStorage.getItem(posKey(e.slug)) || 0);
  const resume = saved > 30 ? `<div class="ep-resume">▶ continuar de ${fmt(saved)}</div>` : '';
  return `<article class="ep" id="ep-${e.slug}">
    <div class="ep-row">
      <button class="ep-play" data-slug="${e.slug}" aria-label="tocar">▶</button>
      <div class="ep-info" data-slug="${e.slug}">
        <h2>${esc(e.titulo)}</h2>
        <div class="ep-meta">${fmtData(e.data)} · ${fmt(e.duracao_seg)}</div>
        ${resume}
      </div>
      <button class="ep-toggle" data-slug="${e.slug}">detalhes</button>
    </div>
    <div class="ep-body">
      <div class="lados">
        <div class="lado esq"><span class="tag">Esquerda</span><p>${esc(e.tese_esquerda)}</p></div>
        <div class="lado dir"><span class="tag">Direita</span><p>${esc(e.tese_direita)}</p></div>
      </div>
      <details class="consenso"><summary>Onde os dois concordam</summary><div class="body"><ul>${li(e.consenso)}</ul></div></details>
      <details><summary>Perguntas em aberto</summary><div class="body"><ul>${li(e.perguntas_abertas)}</ul></div></details>
      <details><summary>Fontes</summary><div class="body">${fontes(e.fontes)||'—'}</div></details>
    </div>
  </article>`;
}

function render(){
  $('app').innerHTML = episodes.length ? episodes.map(card).join('') : '<div class="empty">Nenhum episódio ainda.</div>';
  document.querySelectorAll('.ep-play,.ep-info').forEach(el =>
    el.addEventListener('click', () => togglePlay(el.dataset.slug)));
  document.querySelectorAll('.ep-toggle').forEach(el =>
    el.addEventListener('click', ev => { ev.stopPropagation(); $('ep-'+el.dataset.slug).classList.toggle('open'); }));
}

function markPlaying(){
  document.querySelectorAll('.ep').forEach(el => el.classList.remove('playing'));
  document.querySelectorAll('.ep-play').forEach(b => b.textContent = '▶');
  if(current){
    const el = $('ep-'+current.slug);
    if(el){ el.classList.add('playing'); el.querySelector('.ep-play').textContent = audio.paused ? '▶' : '⏸'; }
  }
  $('p-play').textContent = audio.paused ? '▶' : '⏸';
}

function togglePlay(slug){
  if(current && current.slug === slug){ audio.paused ? audio.play() : audio.pause(); return; }
  const e = episodes.find(x => x.slug === slug); if(!e) return;
  current = e;
  audio.src = e.audio;
  audio.playbackRate = SPEEDS[speedIx];
  const saved = +(localStorage.getItem(posKey(slug)) || 0);
  audio.currentTime = (saved > 5 && saved < (e.duracao_seg - 20)) ? saved : 0;
  $('p-title').textContent = e.titulo;
  $('player').classList.add('on');
  audio.play();
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({title: e.titulo, artist: 'Contraponto'});
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('seekbackward', () => audio.currentTime -= 15);
    navigator.mediaSession.setActionHandler('seekforward', () => audio.currentTime += 30);
  }
}

$('p-play').onclick = () => { if(current) audio.paused ? audio.play() : audio.pause(); };
$('p-back').onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 15);
$('p-fwd').onclick = () => audio.currentTime = Math.min(audio.duration||1e9, audio.currentTime + 30);
$('p-speed').onclick = () => {
  speedIx = (speedIx + 1) % SPEEDS.length;
  audio.playbackRate = SPEEDS[speedIx];
  localStorage.setItem('cp:speed', speedIx);
  $('p-speed').textContent = SPEEDS[speedIx] + '×';
};
$('p-speed').textContent = SPEEDS[speedIx] + '×';

$('p-seek').addEventListener('input', ev => {
  if(audio.duration) audio.currentTime = (ev.target.value/100) * audio.duration;
});

let lastSave = 0;
audio.addEventListener('timeupdate', () => {
  const pct = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
  const bar = $('p-seek'); bar.value = pct; bar.style.setProperty('--fill', pct+'%');
  $('p-cur').textContent = fmt(audio.currentTime);
  $('p-dur').textContent = '-' + fmt((audio.duration||0) - audio.currentTime);
  if(current && Date.now() - lastSave > 3000){
    localStorage.setItem(posKey(current.slug), Math.floor(audio.currentTime));
    lastSave = Date.now();
  }
});
audio.addEventListener('play', markPlaying);
audio.addEventListener('pause', markPlaying);
audio.addEventListener('ended', () => { if(current) localStorage.removeItem(posKey(current.slug)); markPlaying(); });

fetch('episodes.json?_=' + Date.now())
  .then(r => r.json())
  .then(d => { episodes = d.episodes || []; render(); })
  .catch(() => { $('app').innerHTML = '<div class="empty">Não consegui carregar os episódios.</div>'; });
</script>
</body>
</html>

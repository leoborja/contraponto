<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>Contraponto — os dois lados de um debate</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f2430; --txt:#e7e9ee; --muted:#9aa3b2;
    --esq:#4f8cff; --dir:#ff6b6b; --neu:#8b95a5; --consenso:#3ddc97; --linha:#2a2f3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:0 16px 64px;max-width:760px;margin:0 auto}
  header{text-align:center;padding:34px 0 22px;border-bottom:1px solid var(--linha);margin-bottom:24px}
  h1{font-size:30px;letter-spacing:-.5px}
  h1 .a{color:var(--esq)} h1 .b{color:var(--dir)}
  header p{color:var(--muted);margin-top:6px;font-size:15px}
  .ep{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:20px;margin-bottom:20px}
  .ep h2{font-size:20px;line-height:1.3;margin-bottom:4px}
  .meta{color:var(--muted);font-size:13px;margin-bottom:14px}
  audio{width:100%;margin-bottom:16px;filter:saturate(.9)}
  .lados{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  @media(max-width:520px){.lados{grid-template-columns:1fr}}
  .lado{background:var(--card2);border-radius:10px;padding:12px;border-left:3px solid}
  .lado.esq{border-color:var(--esq)} .lado.dir{border-color:var(--dir)}
  .lado .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;display:block}
  .lado.esq .tag{color:var(--esq)} .lado.dir .tag{color:var(--dir)}
  .lado p{font-size:14px;color:#cfd4de}
  details{background:var(--card2);border-radius:10px;margin-top:8px;overflow:hidden}
  summary{cursor:pointer;padding:11px 14px;font-size:14px;font-weight:600;list-style:none;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--muted)}
  details[open] summary::before{content:"▾ "}
  details .body{padding:0 14px 12px}
  details.consenso summary{color:var(--consenso)}
  details ul{margin-left:18px;font-size:14px;color:#cfd4de}
  details li{margin:4px 0}
  .fonte{display:block;font-size:13px;color:var(--esq);text-decoration:none;margin:3px 0;word-break:break-word}
  .fonte:hover{text-decoration:underline}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:34px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1><span class="a">Contra</span><span class="b">ponto</span></h1>
  <p>Os dois lados de um debate, em ~10 minutos. Esquerda, direita, e onde eles concordam.</p>
</header>
<main id="app"><div class="empty">Carregando episódios…</div></main>
<footer>Gerado com pesquisa multi-fonte (web + YouTube) e vozes sintéticas · Contraponto</footer>

<script>
const fmtDur = s => { const m=Math.floor(s/60), ss=String(s%60).padStart(2,'0'); return `${m}:${ss}`; };
const fmtData = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; };
const esc = t => (t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function li(arr){ return (arr||[]).map(x=>`<li>${esc(x)}</li>`).join(''); }
function fontes(arr){ return (arr||[]).map(f=>`<a class="fonte" href="${esc(f.url)}" target="_blank" rel="noopener">↗ ${esc(f.titulo||f.url)}</a>`).join(''); }

function epCard(e){
  return `<article class="ep">
    <h2>${esc(e.titulo)}</h2>
    <div class="meta">${fmtData(e.data)} · ${fmtDur(e.duracao_seg)} min</div>
    <audio controls preload="none" src="${esc(e.audio)}"></audio>
    <div class="lados">
      <div class="lado esq"><span class="tag">Esquerda</span><p>${esc(e.tese_esquerda)}</p></div>
      <div class="lado dir"><span class="tag">Direita</span><p>${esc(e.tese_direita)}</p></div>
    </div>
    <details class="consenso"><summary>Onde os dois concordam</summary><div class="body"><ul>${li(e.consenso)}</ul></div></details>
    <details><summary>Perguntas em aberto</summary><div class="body"><ul>${li(e.perguntas_abertas)}</ul></div></details>
    <details><summary>Fontes</summary><div class="body">${fontes(e.fontes)||'<p style="color:var(--muted);font-size:13px">—</p>'}</div></details>
  </article>`;
}

fetch('episodes.json?_=' + Date.now())
  .then(r => r.json())
  .then(d => {
    const app = document.getElementById('app');
    if(!d.episodes || !d.episodes.length){ app.innerHTML = '<div class="empty">Nenhum episódio ainda.</div>'; return; }
    app.innerHTML = d.episodes.map(epCard).join('');
  })
  .catch(() => { document.getElementById('app').innerHTML = '<div class="empty">Não consegui carregar os episódios.</div>'; });
</script>
</body>
</html>

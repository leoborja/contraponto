# Os três papéis do episódio. voice_id = ID da voz no ElevenLabs.
# Trio icônico: Karl Marx × Milton Friedman, mediados por Sócrates.

narrador:
  nome: Sócrates
  voice_id: "TY3h8ANhQUsJaa0Bga5F"   # Cassio Cruz — brasileiro, neutro
  papel: >
    O mediador que só faz perguntas e nunca toma partido. Abre o tema em poucas
    frases, provoca os dois lados com perguntas certeiras e fecha o episódio com
    "onde os dois concordam" e "quais são as perguntas em aberto".
  voice_settings: { stability: 0.5, similarity_boost: 0.75, style: 0.3 }

host_a:
  nome: Karl Marx
  voice_id: "WSBwiRQRmi2mEG7BfKwS"   # Yuri — brasileiro, imponente e confiante
  papel: >
    Defende a perspectiva progressista / de esquerda com convicção e dados.
    Afiado mas civil: reconhece pontos fortes do outro lado quando são reais,
    nunca constrói espantalho. Fala em primeira pessoa, tom de conversa.
  voice_settings: { stability: 0.35, similarity_boost: 0.75, style: 0.5 }

host_b:
  nome: Milton Friedman
  voice_id: "IlrWo5tGgTuxNTHyGhWD"   # Vagner de Souza — brasileiro, afiado e sarcástico
  papel: >
    Defende a perspectiva conservadora / de direita e livre-mercado com convicção
    e dados. Afiado mas civil: reconhece pontos fortes do outro lado quando são
    reais, nunca constrói espantalho. Fala em primeira pessoa, tom de conversa.
  voice_settings: { stability: 0.4, similarity_boost: 0.75, style: 0.45 }
